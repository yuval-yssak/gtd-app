name: Deploy API

on:
    push:
        branches: [staging, production]
        paths: ['api-server/**']
    # Allow manual deploys (e.g. to pick up secret changes without touching api-server code)
    workflow_dispatch:
        inputs:
            environment:
                description: Target environment
                required: true
                default: production
                type: choice
                options: [production, staging]

env:
    REGION: us-central1
    REGISTRY: us-central1-docker.pkg.dev

jobs:
    deploy:
        runs-on: ubuntu-latest
        # Selects the GitHub Environment by branch name (push) or manual input (workflow_dispatch).
        # Each environment holds its own GCP secrets; 'production' has Required reviewers set.
        environment: ${{ inputs.environment || github.ref_name }}
        permissions:
            contents: read
            id-token: write

        env:
            PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
            # inputs.environment is set on manual dispatch; github.ref_name is used on push
            TARGET_ENV: ${{ inputs.environment || github.ref_name }}

        steps:
            - uses: actions/checkout@v6

            - id: auth
              uses: google-github-actions/auth@v3
              with:
                  workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - uses: google-github-actions/setup-gcloud@v3

            - run: gcloud auth configure-docker ${{ env.REGISTRY }}

            - name: Build and push
              run: |
                  SERVICE=${{ env.TARGET_ENV == 'production' && 'gtd-api' || 'gtd-api-staging' }}
                  IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/gtd/$SERVICE:${{ github.sha }}
                  # Build from repo root so Docker can access the monorepo root package-lock.json
                  docker build -f api-server/Dockerfile --build-arg COMMIT_HASH=${GITHUB_SHA::7} -t $IMAGE .
                  docker push $IMAGE
                  echo "IMAGE=$IMAGE" >> $GITHUB_ENV
                  echo "SERVICE=$SERVICE" >> $GITHUB_ENV

            # --startup-probe: GET /health (a bounded Mongo ping, routes/health.ts) replaces the default
            # TCP probe. A Mongo that is unreachable at boot already fails the revision — start() rejects
            # before it listens, and the `[boot] startup failed` line says why; the probe adds the case
            # where the pool dies between boot and readiness, and gives uptime checks a URL that means
            # "can serve", not just "process is up". 48 x 5 s keeps the default 240 s startup budget:
            # start() runs migrations + index builds before it listens.
            - name: Deploy to Cloud Run
              run: |
                  # Write env vars to a YAML file to safely handle special characters in values
                  cat > env.yaml << 'EOF'
                  NODE_ENV: production
                  MONGO_DB_URL: "${{ secrets.MONGO_DB_URL }}"
                  MONGO_DB_NAME: "${{ vars.MONGO_DB_NAME }}"
                  GOOGLE_OAUTH_APP_CLIENT_ID: "${{ secrets.GOOGLE_OAUTH_APP_CLIENT_ID }}"
                  GOOGLE_OAUTH_APP_CLIENT_SECRET: "${{ secrets.GOOGLE_OAUTH_APP_CLIENT_SECRET }}"
                  GITHUB_CLIENT_ID: "${{ secrets.GH_OAUTH_CLIENT_ID }}"
                  GITHUB_CLIENT_SECRET: "${{ secrets.GH_OAUTH_CLIENT_SECRET }}"
                  BETTER_AUTH_SECRET: "${{ secrets.BETTER_AUTH_SECRET }}"
                  BETTER_AUTH_URL: "${{ vars.BETTER_AUTH_URL }}"
                  CLIENT_URL: "${{ vars.CLIENT_URL }}"
                  VAPID_PRIVATE_KEY: "${{ secrets.VAPID_PRIVATE_KEY }}"
                  VAPID_PUBLIC_KEY: "${{ vars.VAPID_PUBLIC_KEY }}"
                  VAPID_SUBJECT: "${{ vars.VAPID_SUBJECT }}"
                  CALENDAR_WEBHOOK_URL: "${{ vars.CALENDAR_WEBHOOK_URL }}"
                  CALENDAR_ENCRYPTION_KEY: "${{ secrets.CALENDAR_ENCRYPTION_KEY }}"
                  # Shared secret every Cloud Scheduler job sends as `x-cron-secret`: GCal watch-channel
                  # renewal (POST /calendar/webhooks/renew) and the brief sweep (POST /maintenance/briefs/sweep).
                  # Empty string == both endpoints reject all callers.
                  CRON_SECRET: "${{ secrets.CRON_SECRET }}"
                  # Outbound webhook delivery worker: off in production until you opt in by setting
                  # the GitHub Environment variable WEBHOOKS_ENABLED=true. Empty string == off.
                  WEBHOOKS_ENABLED: "${{ vars.WEBHOOKS_ENABLED }}"
                  # Lane A Claude-assist ("clarify with AI"). ANTHROPIC_API_KEY + EXECUTE_TOKEN_SIGNING_KEY
                  # are Environment secrets; without the API key the endpoint 503s, and since NODE_ENV is
                  # production a missing/short signing key is a hard error when minting execute tokens.
                  # The cost cap is a non-sensitive Environment variable (code default applies if empty).
                  ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
                  EXECUTE_TOKEN_SIGNING_KEY: "${{ secrets.EXECUTE_TOKEN_SIGNING_KEY }}"
                  CLAUDE_ASSIST_DAILY_COST_CAP_USD: "${{ vars.CLAUDE_ASSIST_DAILY_COST_CAP_USD }}"
                  EOF
                  # SSE connection registry is in-process — multi-instance fanout would lose
                  # webhook-triggered notifications when the webhook lands on an instance that
                  # doesn't hold the user's SSE controller. Revisit when sseConnections.ts moves
                  # to Redis pub/sub.
                  # Deployed with --no-traffic, then promoted in the next step. With
                  # --max-instances=1 the whole service is capped at one instance, so Cloud Run
                  # cannot start the new revision until the old one drains -- and open browser
                  # tabs holding long-lived SSE streams keep it busy indefinitely. Letting
                  # `gcloud run deploy` also migrate traffic made it block on that drain and time
                  # out (observed 2026-09-22: 59m rollout, gcloud gave up at ~56m and exited 1,
                  # although the revision came up healthy on its own). Splitting the two keeps
                  # this step bounded by image rollout alone.
                  gcloud run deploy $SERVICE \
                    --image=$IMAGE \
                    --region=${{ env.REGION }} \
                    --platform=managed \
                    --allow-unauthenticated \
                    --max-instances=1 \
                    --startup-probe=httpGet.path=/health,periodSeconds=5,timeoutSeconds=3,failureThreshold=48 \
                    --no-traffic \
                    --env-vars-file=env.yaml

            # Traffic migration is a separate step so the deploy above cannot time out on it:
            # with --max-instances=1 the new revision only starts once the old instance drains,
            # and open SSE streams can hold that off for tens of minutes. The wait lives here,
            # bounded, instead of being folded into an unbounded `gcloud run deploy`.
            #
            # This step is REQUIRED, not an optimization: --no-traffic pins traffic to the
            # specific revision that was live before the deploy and turns off the service's
            # "float to LATEST" behaviour, so skipping it would leave the old revision serving
            # indefinitely while the job still looked green. --to-latest restores floating.
            - name: Route traffic to the new revision
              run: |
                  set -euo pipefail
                  # Bounded wait, not --async: --async returns as soon as the intent is
                  # recorded, so a revision that fails readiness would leave the old one serving
                  # with this job still green -- and because --no-traffic pinned the split, that
                  # silent failure would wedge every later deploy too. 5m is far longer than a
                  # traffic flip needs and far shorter than the drain that broke `run deploy`.
                  timeout 300 gcloud run services update-traffic $SERVICE \
                    --region=${{ env.REGION }} \
                    --platform=managed \
                    --to-latest

            # Proves traffic actually landed on the revision we just built. update-traffic
            # returning 0 only means Cloud Run accepted the request; this asserts the serving
            # revision is the latest ready one, so a rollout that silently stalled -- leaving the
            # service pinned to an old revision by --no-traffic -- fails the job instead of
            # passing it.
            - name: Verify traffic reached the new revision
              run: |
                  set -euo pipefail
                  for _ in $(seq 1 30); do
                      serving=$(gcloud run services describe $SERVICE --region=${{ env.REGION }} \
                        --platform=managed --format='value(status.traffic[0].revisionName)')
                      latest=$(gcloud run services describe $SERVICE --region=${{ env.REGION }} \
                        --platform=managed --format='value(status.latestReadyRevisionName)')
                      if [ -n "$serving" ] && [ "$serving" = "$latest" ]; then
                          echo "traffic serving $serving"
                          exit 0
                      fi
                      echo "waiting: serving=${serving:-<none>} latest=${latest:-<none>}"
                      sleep 10
                  done
                  echo "traffic never migrated to ${latest:-<unknown>}" >&2
                  exit 1
